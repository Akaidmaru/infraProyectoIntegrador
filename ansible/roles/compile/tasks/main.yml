- name: Compilar front con Vite
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source $NVM_DIR/nvm.sh
    npm run build
  args:
    chdir: /var/www/petcare-front
    executable: /bin/bash
  become: true
  become_user: ubuntu

- name: Compilar backend con Maven
  ansible.builtin.shell: |
    mvn clean install
  args:
    chdir: /var/www/petcare-back
    executable: /bin/bash
  become: true
  become_user: ubuntu