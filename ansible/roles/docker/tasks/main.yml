---
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: yes
    state: present
  become: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: true

- name: Start and enable Docker service (systemd)
  systemd:
    name: docker
    state: started
    enabled: yes
  become: true

- name: Create application directory
  file:
    path: /opt/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  become: true

- name: Copy docker-compose.yml to app directory
  copy:
    src: ../../../docker/docker-compose.yml
    dest: /opt/app/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  become: true

- name: Reiniciar sesión para aplicar grupo docker (opcional)
  shell: newgrp docker
  when: false
