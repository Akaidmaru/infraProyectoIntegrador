---
version: '3.8'

services:
  frontend:
    image: ghcr.io/akaidmaru/digitalhouse-proyectointegrador-team1-petcare:latest
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    image: ghcr.io/akaidmaru/proyectoIntegradorBackend-team1:latest
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"