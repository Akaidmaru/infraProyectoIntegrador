---
- name: Instalar nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    if [ ! -s "$NVM_DIR/nvm.sh" ]; then
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
    fi
  args:
    executable: /bin/bash
  become: yes
  become_user: ubuntu

- name: Instalar Node.js versión 22
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source $NVM_DIR/nvm.sh
    nvm install 22
  args:
    executable: /bin/bash
  become: yes
  become_user: ubuntu

- name: Verificar instalación de Node.js
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    source $NVM_DIR/nvm.sh
    node -v
  args:
    executable: /bin/bash
  become: yes
  become_user: ubuntu
  register: node_version

- name: Mostrar versión de Node.js instalada
  ansible.builtin.debug:
    msg: "La versión de Node.js instalada es {{ node_version.stdout }}"

- name: Clonar repo front
  git:
    repo: https://github.com/jehansel/DigitalHouse-ProyectoIntegrador-Team1-PetCare.git
    dest: /var/www/petcare-front
  become: true

- name: Instalar dependencias del front (npm install)
  ansible.builtin.shell: bash -l -c 'npm install'
  args:
    chdir: /var/www/petcare-front
    executable: /bin/bash
  become: true
  become_user: ubuntu

- name: Compilar front con Vite
  ansible.builtin.shell: bash -l -c 'npm run build'
  args:
    chdir: /var/www/petcare-front
    executable: /bin/bash
  become: true
  become_user: ubuntu
